name: Upload to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    name: Codesign and Deliver IPA to App Store Connect
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/embedded.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Codesign IPA for App Store
        env:
          CERTIFICATE_NAME: ${{ secrets.CERTIFICATE_NAME }}
        run: |
          set -e
          echo "Extracting IPA..."
          rm -rf app_payload AlBayanApp-AppStore.ipa
          unzip -q xtool/AlBayanApp.ipa -d app_payload

          APP_PATH="app_payload/Payload/AlBayanApp.app"
          PLIST="$APP_PATH/Info.plist"
          BINARY="$APP_PATH/AlBayanApp"

          echo "Injecting embedded.mobileprovision..."
          cp "$RUNNER_TEMP/embedded.mobileprovision" "$APP_PATH/embedded.mobileprovision"

          echo "Detecting Xcode and iOS SDK details on runner..."
          SDK_VERSION=$(xcrun --show-sdk-version --sdk iphoneos)
          SDK_BUILD=$(xcrun --show-sdk-build-version --sdk iphoneos)
          XCODE_BUILD=$(xcodebuild -version | grep "Build version" | awk '{print $3}')
          XCODE_VERSION_RAW=$(xcodebuild -version | head -n 1 | awk '{print $2}')
          MAJOR=$(echo "$XCODE_VERSION_RAW" | cut -d. -f1)
          MINOR=$(echo "$XCODE_VERSION_RAW" | cut -d. -f2)
          XCODE_VERSION=$(printf "%02d%d0" "$MAJOR" "$MINOR")
          OS_BUILD=$(sw_vers -buildVersion 2>/dev/null || echo "23F79")

          echo "SDK_VERSION: $SDK_VERSION"
          echo "SDK_BUILD: $SDK_BUILD"
          echo "XCODE_VERSION: $XCODE_VERSION"
          echo "XCODE_BUILD: $XCODE_BUILD"

          echo "Injecting Apple App Store required Xcode metadata into Info.plist..."
          /usr/libexec/PlistBuddy -c "Add :DTPlatformName string iphoneos" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :DTPlatformName iphoneos" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DTPlatformVersion string $SDK_VERSION" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :DTPlatformVersion $SDK_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DTSDKName string iphoneos$SDK_VERSION" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :DTSDKName iphoneos$SDK_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DTSDKBuild string $SDK_BUILD" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :DTSDKBuild $SDK_BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DTPlatformBuild string $SDK_BUILD" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :DTPlatformBuild $SDK_BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DTXcode string $XCODE_VERSION" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :DTXcode $XCODE_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DTXcodeBuild string $XCODE_BUILD" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :DTXcodeBuild $XCODE_BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DTCompiler string com.apple.compilers.llvm.clang.1_0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :DTCompiler com.apple.compilers.llvm.clang.1_0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :BuildMachineOSBuild string $OS_BUILD" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :BuildMachineOSBuild $OS_BUILD" "$PLIST"

          echo "Compiling Asset Catalog (Assets.car)..."
          xcrun actool AlBayanApp/Resources/Assets.xcassets \
            --compile "$APP_PATH" \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --app-icon AppIcon \
            --output-partial-info-plist "$RUNNER_TEMP/asset_info.plist" || true

          echo "Copying fallback icon PNGs directly into app bundle..."
          cp AlBayanApp/Resources/AppIcon*.png "$APP_PATH/" || true
          cp AlBayanApp/Resources/Assets.xcassets/AppIcon.appiconset/*.png "$APP_PATH/" || true

          echo "Ensuring CFBundleIconName and CFBundleIcons in Info.plist..."
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName AppIcon" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:1 string AppIcon76x76" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:2 string AppIcon83.5x83.5" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName AppIcon" "$PLIST"

          echo "Updating Mach-O build version with vtool..."
          if xcrun --find vtool >/dev/null 2>&1; then
            xcrun vtool -show "$BINARY" || true
            xcrun vtool -set-build-version 2 16.0 "$SDK_VERSION" -replace -output "$BINARY" "$BINARY" || true
            xcrun vtool -show "$BINARY" || true
          fi

          echo "Extracting entitlements from mobileprovision..."
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

          echo "Signing application binary and bundle..."
          /usr/bin/codesign --force --sign "$CERTIFICATE_NAME" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --timestamp \
            --generate-entitlement-der \
            "$APP_PATH"

          echo "Verifying code signature..."
          /usr/bin/codesign --verify --verbose=2 "$APP_PATH"

          echo "Repackaging into production IPA..."
          cd app_payload
          zip -qr ../AlBayanApp-AppStore.ipa Payload
          cd ..
          ls -lh AlBayanApp-AppStore.ipa

      - name: Setup App Store Connect API Key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f AlBayanApp-AppStore.ipa \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
